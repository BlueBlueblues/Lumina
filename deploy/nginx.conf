# Lumina · Nginx 同域部署配置
# 静态前端 + /api 反向代理到本机 Fastify。
# HTTPS 证书用 certbot --nginx 自动写入；下方 HTTP 块保留用于首次签发。

server {
    listen 80;
    listen [::]:80;
    # 本地/裸 IP 测试时，把公网 IP 或 _ 追加到 server_name
    server_name shiyulab.xyz www.shiyulab.xyz;

    root /opt/lumina/frontend;
    index index.html;
    server_tokens off;

    client_max_body_size 16m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~* \.(?:js|css|png|jpe?g|webp|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

