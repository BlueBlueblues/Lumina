# HTTP retained: existing browser IndexedDB is bound to the HTTP origin.
server {
    listen 80;
    listen [::]:80;
    server_name shiyulab.xyz www.shiyulab.xyz 139.196.164.70;
    root /opt/lumina/frontend;
    index index.html;
    server_tokens off;
    # --- hardening 2026-11-20 ---
    gzip_comp_level 5;
    gzip_proxied any;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(bak|orig|swp|md|txt|log|sql|dump|env)$ { deny all; return 404; }
    # --- end hardening ---

    client_max_body_size 16m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    location /assets/ { include snippets/lumina-security-headers.conf; expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /recall-assets/ { include snippets/lumina-security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri =404; }
    location /src/ { include snippets/lumina-security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri =404; }
    location / { include snippets/lumina-security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shiyulab.xyz www.shiyulab.xyz;
    ssl_certificate /etc/letsencrypt/live/shiyulab.xyz/fullchain.pem;
